<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总览</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    if (q.get('solid') === '1') document.documentElement.setAttribute('data-solid', '');
  })();
</script>
<style>
  /* ═══ 铺满版 · 四块吃满容器 ══════════════════════════════════════════
     之前 .stage 上挂了个 max-width: 400px —— 容器再宽内容也只长到 400，
     在 Notion 里就等于两头留白、字看着更小。现在全去掉，四个块直接吃满。

     两种形态按容器宽高比自动切：
       宽高比 < 5:2（竖的、方的）  → 上两块并排 + 下两块通栏
       宽高比 ≥ 5:2（扁的）        → 四块横排一行

     字号统一用 min(vh, vw) 双约束 + vmin 兜底，容器放大字就跟着放大，
    容器再小也压不散。 */

  .card { padding: clamp(6px, 1.8vmin, 18px); }

  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(4px, 1.4vmin, 12px);
    text-align: left;
  }

  .blk {
    background: var(--surface);
    border-radius: var(--r-md);
    padding: clamp(5px, 1.9vmin, 16px) clamp(6px, 2vmin, 15px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(1px, .55vmin, 5px);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .pair {
    display: flex;
    align-items: stretch;
    gap: clamp(4px, 1.4vmin, 10px);
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
  }
  .blk--time { flex: 0 0 auto; }
  .blk--wx   { flex: 1 1 auto; }

  .blk--count {
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: clamp(6px, 2vmin, 16px);
  }
  .count-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(0px, .35vmin, 3px);
    text-align: right;
    min-width: 0;
  }

  /* ─── 字级：主数字一套，其余全挂 .sub ──────────────────── */
  .num {
    display: flex;
    align-items: baseline;
    gap: clamp(1px, .6vmin, 6px);
    line-height: .92;
    color: var(--ink);
    font-weight: var(--w-strong);
    letter-spacing: -.03em;
  }

  /* 三个主数字：跟容器同步放大，上限放到 130 不封顶得太早 */
  #time { font-size: clamp(16px, min(10.2vh, 14vw), 120px); }
  #sec  { font-size: clamp(10px, min(5.1vh, 7vw), 60px); color: var(--ink-3); }
  #temp { font-size: clamp(13px, min(7.2vh, 10vw), 84px); }
  #days { font-size: clamp(15px, min(8.2vh, 11.5vw), 96px); }

  .unit, .deg {
    font-size: clamp(8px, min(3.4vh, 4.2vw), 30px);
    color: var(--ink-3);
    letter-spacing: .06em;
  }

  .sub {
    font-size: clamp(7px, min(2.7vh, 3.3vw), 18px);
    color: var(--ink-3);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .sub b { color: var(--ink-2); font-weight: var(--w-body); }
  .sub--main { color: var(--ink-2); }

  #text {
    margin: 0;
    font-size: clamp(9px, min(3.9vh, 4.8vw), 34px);
    line-height: 1.5;
    font-weight: var(--w-strong);
    color: var(--ink);
    min-width: 0;
    text-wrap: pretty;
  }
  .by-row {
    display: flex;
    align-items: baseline;
    gap: clamp(3px, 1vmin, 10px);
    margin-top: clamp(1px, .7vmin, 7px);
  }
  #by { color: var(--ink-2); }

  /* ─── 横向偏方（6:5 ~ 22:10）：一大三小，不是四格均分 ───
     四等分最呆板 —— 四块一样大、一样重，眼睛不知道先看哪儿。
     改成时间块跨两行当主角（占 1.45 倍宽、两行高），
     天气和倒计时在右侧上下排，引文收底通栏。 */
  @media (min-aspect-ratio: 6/5) and (max-aspect-ratio: 22/10) {
    .stage {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      grid-template-rows: 1fr 1fr auto;
      grid-template-areas:
        "time  wx"
        "time  count"
        "quote quote";
      gap: clamp(4px, 1.3vmin, 13px);
    }
    .pair { display: contents; }

    .blk--time  { grid-area: time; }
    .blk--wx    { grid-area: wx; }
    .blk--count { grid-area: count; }
    .blk--quote { grid-area: quote; }

    /* 倒计时块在这个档只有 280 宽，塞左右两组会断开一大段空隙 ——
       改成竖排左对齐，跟上面天气块同一个呼吸节奏 */
    .blk--count {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(1px, .5vmin, 5px);
    }
    .count-right {
      align-items: flex-start;
      text-align: left;
      gap: clamp(0px, .3vmin, 2px);
    }

    /* 时间块最大，字号给它放到最大；其余按格子尺寸退一档 */
    #time { font-size: clamp(20px, min(21vmin, 14vw), 150px); }
    #sec  { font-size: clamp(11px, min(10vmin, 6.6vw), 72px); }
    #temp { font-size: clamp(13px, min(10vmin, 7vw), 76px); }
    #days { font-size: clamp(15px, min(11vmin, 7.6vw), 84px); }
    .unit, .deg { font-size: clamp(8px, min(4.2vmin, 3.2vw), 26px); }
    .sub  { font-size: clamp(7px, min(3.2vmin, 2.5vw), 16px); }
    #text { font-size: clamp(9px, min(4.4vmin, 3.4vw), 30px); }
  }

  /* ─── 扁容器：四块横排一行，各自按比例分宽度 ─────────────
     Notion 的 embed 拖成很扁的时候（宽高比 2.5 以上）。 */
  @media (min-aspect-ratio: 5/2) {
    .stage {
      flex-direction: row;
      align-items: stretch;
      gap: clamp(4px, 1vmin, 10px);
    }
    .pair { display: contents; }        /* 拆掉包裹层，四块直接并排 */

    .blk--time  { flex: 2.2 1 0; }
    .blk--wx    { flex: 1.25 1 0; }
    .blk--count { flex: 1.7 1 0; flex-direction: column; align-items: flex-start; justify-content: center; }
    .blk--quote { flex: 1.9 1 0; }

    .count-right { align-items: flex-start; text-align: left; }

    /* 扁框里高度就是瓶颈，全部按 vh 定，把纵向空间吃满 */
    #time { font-size: clamp(13px, 15.5vh, 72px); }
    #sec  { font-size: clamp(9px, 8.5vh, 34px); }
    #temp { font-size: clamp(11px, 12vh, 50px); }
    #days { font-size: clamp(12px, 13.5vh, 56px); }
    .unit, .deg { font-size: clamp(7px, 6vh, 22px); }
    .sub  { font-size: clamp(6px, 5vh, 13px); }
    #text { font-size: clamp(7px, 5.4vh, 15px); line-height: 1.35; }
    .blk  { padding: clamp(4px, 4.5vh, 14px) clamp(5px, 1.6vmin, 14px); }
  }

  /* 极窄竖屏：只压字号，结构不动 */
  @media (max-width: 280px) {
    #time { font-size: clamp(14px, 11vw, 60px); }
    #temp { font-size: clamp(12px, 8vw, 40px); }
    #days { font-size: clamp(13px, 9vw, 46px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <!-- 上半：时间块 + 天气块 -->
      <div class="pair">

        <div class="blk blk--time">

          <span id="date" class="sub sub--main">—</span>
          <span id="lunar" class="sub">—</span>
          <span id="festival" class="sub">—</span>
        </div>

        <div class="blk blk--wx">
          <div class="num"><span id="temp">—</span><span class="deg">°C</span></div>
          <span id="desc" class="sub sub--main">正在读取…</span>
          <span class="sub">最高<b id="hi">—</b>　最低<b id="lo">—</b></span>
          <span class="sub">体感<b id="feel">—</b>　湿度<b id="hum">—</b></span>
        </div>

      </div>

      <!-- 中段：倒计时 -->
      <div class="blk blk--count">
        <div class="num"><span id="days">—</span><span class="unit">天</span></div>
        <div class="count-right">
          <span class="sub sub--main"><span id="label">—</span> · <span id="target">—</span></span>
          <span id="detail" class="sub">—</span>
        </div>
      </div>

      <!-- 底部：今日一句 -->
      <div class="blk blk--quote">
        <p id="text">—</p>
        <div class="by-row">
          <span id="by" class="sub">—</span>
          <span id="qdate" class="sub">—</span>
        </div>
      </div>

    </div>
  </div>
<script src="../assets/lunar.js"></script>
<script>
/* ═══ ① 时钟 ═══════════════════════════════════════════════ */
(function () {
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  var elTime  = document.getElementById('time');
  var elSec   = document.getElementById('sec');
  var elDate  = document.getElementById('date');
  var elLunar = document.getElementById('lunar');
  var elFest  = document.getElementById('festival');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ── 只看这五个重要节日：公历三个、农历两个 ──────────────
  var FEST = [
    { type: 'solar', m: 10, d: 1,  name: '国庆'   },
    { type: 'solar', m: 10, d: 31, name: '万圣节' },
    { type: 'solar', m: 12, d: 25, name: '圣诞'   },
    { type: 'lunar', m: 8,  d: 15, name: '中秋'   },
    { type: 'lunar', m: 1,  d: 1,  name: '春节'   }
  ];

  /* 从今天起往后找最近的一个节日；农历节日靠 toLunar 逐日试出来 */
  function nextFestival(from) {
    var y = from.getFullYear(), mo = from.getMonth(), da = from.getDate();
    for (var i = 0; i <= 420; i++) {
      var d = new Date(y, mo, da + i);
      for (var k = 0; k < FEST.length; k++) {
        var f = FEST[k];
        if (f.type === 'solar') {
          if (d.getMonth() + 1 === f.m && d.getDate() === f.d) return { name: f.name, days: i };
        } else if (typeof toLunar === 'function') {
          var l = toLunar(d);
          if (!l.leap && l.m === f.m && l.d === f.d) return { name: f.name, days: i };
        }
      }
    }
    return null;
  }

  var lastKey = '';

  function tick() {
    var d = new Date();
    elTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    elSec.textContent  = ':' + pad(d.getSeconds());

    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (key !== lastKey) {
      lastKey = key;
      var lunar = '';
      try { lunar = (typeof lunarText === 'function') ? lunarText(d) : ''; } catch (e) {}
      elDate.textContent  = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate())
                          + ' ' + WEEK[d.getDay()];
      elLunar.textContent = lunar || ' ';

      // 距下一个重要节日（一天只算一次）
      if (elFest) {
        try {
          var f = nextFestival(d);
          elFest.textContent = !f ? ' '
            : f.days === 0 ? '今天 · ' + f.name
            : f.days === 1 ? '明天 · ' + f.name
            : '距' + f.name + ' ' + f.days + ' 天';
        } catch (e2) { elFest.textContent = ' '; }
      }
    }
  }
  tick();
  setInterval(tick, 1000);
})();

/* ═══ ② 天气（Open-Meteo，免费无 key）══════════════════════ */
(function () {
  var CITIES = {
    dt: { name: '大同', lat: 40.0933, lon: 113.2998 },
    sz: { name: '苏州', lat: 31.2989, lon: 120.5853 }
  };
  var WMO = {
    0:'晴', 1:'大部晴', 2:'多云', 3:'阴',
    45:'雾', 48:'雾凇',
    51:'毛毛雨', 53:'小雨', 55:'细密雨',
    56:'冻雨', 57:'冻雨',
    61:'小雨', 63:'中雨', 65:'大雨',
    66:'冻雨', 67:'强冻雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'雪粒',
    80:'阵雨', 81:'阵雨', 82:'强阵雨',
    85:'阵雪', 86:'强阵雪',
    95:'雷阵雨', 96:'雷暴冰雹', 99:'强雷暴冰雹'
  };

  var elTemp = document.getElementById('temp');
  var elDesc = document.getElementById('desc');
  var elHi   = document.getElementById('hi');
  var elLo   = document.getElementById('lo');
  var elFeel = document.getElementById('feel');
  var elHum  = document.getElementById('hum');

  var wanted = new URLSearchParams(location.search).get('city');
  var current = (wanted && CITIES[wanted]) ? wanted : 'dt';

  var cache = {};
  var TTL = 10 * 60 * 1000;

  function fail(msg) {
    elTemp.textContent = '—';
    elDesc.textContent = msg || '暂时读不到天气';
    elHi.textContent = '—'; elLo.textContent = '—';
    elFeel.textContent = '—'; elHum.textContent = '—';
  }

  function render(d, city) {
    var cur = d.current || {};
    var day = d.daily || {};
    elTemp.textContent = Math.round(cur.temperature_2m);
    elDesc.textContent = (WMO[cur.weather_code] || '—') + ' · ' + city.name;

    var hi = Math.round((day.temperature_2m_max || [])[0]);
    var lo = Math.round((day.temperature_2m_min || [])[0]);
    elHi.textContent   = isFinite(hi) ? hi + '°' : '—';
    elLo.textContent   = isFinite(lo) ? lo + '°' : '—';
    elFeel.textContent = Math.round(cur.apparent_temperature) + '°';
    elHum.textContent  = Math.round(cur.relative_humidity_2m) + '%';
  }

  function fetchWeather(key) {
    var city = CITIES[key];
    var hit = cache[key];
    if (hit && Date.now() - hit.at < TTL) { render(hit.data, city); return; }

    elDesc.textContent = '正在读取…';

    var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=' + city.lat + '&longitude=' + city.lon
            + '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m'
            + '&daily=temperature_2m_max,temperature_2m_min'
            + '&timezone=Asia%2FShanghai&forecast_days=1';

    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        cache[key] = { at: Date.now(), data: data };
        render(data, city);
      })
      .catch(function () {
        clearTimeout(timer);
        fail('暂时读不到天气');
      });
  }

  fetchWeather(current);
  setInterval(function () { fetchWeather(current); }, TTL);
})();

/* ═══ ③ 倒计时 ═════════════════════════════════════════════ */
(function () {
  var q = new URLSearchParams(location.search);
  var dateStr = q.get('date') || '2027-06-07';
  var label   = q.get('label') || '高考';

  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(dateStr);
  var target = m
    ? new Date(+m[1], +m[2] - 1, +m[3], 0, 0, 0)
    : new Date(2027, 5, 7, 0, 0, 0);

  document.getElementById('label').textContent = label;
  document.getElementById('target').textContent =
    target.getFullYear() + '.' + ('0' + (target.getMonth() + 1)).slice(-2) + '.' + ('0' + target.getDate()).slice(-2);

  var elDays = document.getElementById('days');
  var elDetail = document.getElementById('detail');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var now = new Date();
    var diff = target - now;
    var past = diff < 0;
    var abs = Math.abs(diff);

    var d  = Math.floor(abs / 864e5);
    var h  = Math.floor(abs % 864e5 / 36e5);
    var mi = Math.floor(abs % 36e5 / 6e4);
    var s  = Math.floor(abs % 6e4 / 1e3);

    elDays.textContent = past ? '−' + d : d;
    var tail = (h > 0 ? h + ' 时 ' : '') + pad(mi) + ' 分 ' + pad(s) + ' 秒';
    elDetail.textContent = (past ? '超 ' : '余 ') + tail;
  }
  tick();
  setInterval(tick, 1000);
})();

  var key = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();

  var h = key;
  h = (h ^ 61) ^ (h >>> 16);
  h = h + (h << 3);
  h = h ^ (h >>> 4);
  h = h * 0x27d4eb2d;
  h = h ^ (h >>> 15);

  var item = POOL[Math.abs(h) % POOL.length];
  document.getElementById('text').textContent = item[0];
  document.getElementById('by').textContent = item[1];
  document.getElementById('qdate').textContent =
    now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate());
})();
</script>
</body>
</html>
