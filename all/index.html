<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总览</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    if (q.get('solid') === '1') document.documentElement.setAttribute('data-solid', '');
  })();
</script>
<style>
  /* ═══ 交叉版 · 两列咬合 ══════════════════════════════════════════════
     之前四条横带一路兜到底，读起来像报表。这版改成两列交错咬合：

        ┌─────────────────┬──────────────┐
        │ 16:43           │ 阴 · 大同     │
        │ :26             │ 6°C          │
        │ 2026.10.31      │ 最高9° 最低0° │
        │ 周六 九月廿二     │ 体感1° 湿度39% │
        │ 218 天          │ 高考 2027.06.07│
        │                 │ 余7时16分33秒  │
        └─────────────────┴──────────────┘
         「一个人知道自己为什么而活，
           就可以忍受任何一种生活。」   —— 尼采

     网格区就是这四块：time / wx / date / target，外加引文跨满两列。
     天气块跨了第 1、2 两行 —— 它一侧咬着大字时间、另一侧咬着小字日期，
     这就是"交叉"的地方：块与块之间靠高度互锁，不靠通栏横线隔开。 */

  .card { padding: clamp(12px, 2.4vh, 22px) clamp(14px, 3.4vw, 28px); }

  .stage {
    height: 100%;
    width: 100%;
    max-width: min(100%, 400px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    grid-template-areas:
      "time  wx"
      "date  wx"
      "days  target"
      "quote quote";
    align-content: center;
    column-gap: clamp(10px, 3vw, 20px);
    row-gap: clamp(5px, 1.5vh, 14px);
    text-align: left;
  }

  .c-time   { grid-area: time; }
  .c-date   { grid-area: date; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .c-days   { grid-area: days; }

  /* 天气块跨两行：状况贴顶、四项贴底，把两行高度全咬住 */
  .c-wx {
    grid-area: wx;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    gap: clamp(3px, .9vh, 8px);
    text-align: right;
    min-width: 0;
  }
  /* 倒计时附注贴底，跟左边"天"字落在同一条基线上 */
  .c-target {
    grid-area: target;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    gap: clamp(1px, .4vh, 3px);
    text-align: right;
    min-width: 0;
  }

  .c-quote {
    grid-area: quote;
    border-top: 1px solid var(--line);
    margin-top: clamp(2px, .8vh, 8px);
    padding-top: clamp(8px, 2vh, 18px);
  }

  /* ─── 字级：主数字一套，其余全挂 .sub ──────────────────── */
  .num {
    display: flex;
    align-items: baseline;
    gap: clamp(2px, .7vw, 6px);
    line-height: .92;
    color: var(--ink);
    font-weight: var(--w-strong);
    letter-spacing: -.03em;
  }
  #time { font-size: clamp(24px, min(9.3vh, 10.8vw), 92px); }
  #sec  { font-size: clamp(12px, min(4.65vh, 5.4vw), 46px); color: var(--ink-3); }
  #days { font-size: clamp(20px, min(7.4vh, 8.6vw), 72px); }
  #temp { font-size: clamp(15px, min(6.4vh, 7.2vw), 62px); }

  .unit, .deg {
    font-size: clamp(9px, min(2.9vh, 3.2vw), 24px);
    color: var(--ink-3);
    letter-spacing: .06em;
  }

  .sub {
    font-size: clamp(9px, min(2.3vh, 2.9vw), 13px);
    color: var(--ink-3);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .sub b { color: var(--ink-2); font-weight: var(--w-body); }
  .sub--main { color: var(--ink-2); }

  /* ─── 引文 ─────────────────────────────────────────── */
  #text {
    margin: 0;
    font-size: clamp(11px, min(3.4vh, 4.2vw), 24px);
    line-height: 1.55;
    font-weight: var(--w-strong);
    color: var(--ink);
    min-width: 0;
    text-wrap: pretty;
  }
  .by-row {
    display: flex;
    align-items: baseline;
    gap: clamp(4px, 1vw, 9px);
    margin-top: clamp(3px, .9vh, 8px);
  }
  #by { color: var(--ink-2); }

  /* 极窄时只压字号，网格不动 */
  @media (max-width: 300px) {
    #time { font-size: clamp(20px, 11vw, 62px); }
    #temp { font-size: clamp(14px, 7.5vw, 48px); }
    #days { font-size: clamp(18px, 8.5vw, 52px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <!-- 左列 · 时间 -->
      <div class="c-time">
        <div class="num"><span id="time">--:--</span><span id="sec">:--</span></div>
      </div>

      <!-- 右列 · 天气（跨两行，咬着时间和日期） -->
      <div class="c-wx">
        <span id="desc" class="sub sub--main">正在读取…</span>
        <div class="num"><span id="temp">—</span><span class="deg">°C</span></div>
        <span class="sub">最高<b id="hi">—</b>　最低<b id="lo">—</b></span>
        <span class="sub">体感<b id="feel">—</b>　湿度<b id="hum">—</b></span>
      </div>

      <!-- 左列 · 日期 -->
      <div class="c-date">
        <span id="date" class="sub sub--main">—</span>
        <span id="lunar" class="sub">—</span>
      </div>

      <!-- 左列 · 倒计时天数 -->
      <div class="c-days">
        <div class="num"><span id="days">—</span><span class="unit">天</span></div>
      </div>

      <!-- 右列 · 倒计时附注，贴底与"天"同基线 -->
      <div class="c-target">
        <span class="sub sub--main"><span id="label">—</span> · <span id="target">—</span></span>
        <span id="detail" class="sub">—</span>
      </div>

      <!-- 跨两列 · 今日一句 -->
      <div class="c-quote">
        <p id="text">—</p>
        <div class="by-row">
          <span id="by" class="sub">—</span>
          <span id="qdate" class="sub">—</span>
        </div>
      </div>

    </div>
  </div>

<script src="../assets/lunar.js"></script>
<script>
/* ═══ ① 时钟 ═══════════════════════════════════════════════ */
(function () {
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  var elTime  = document.getElementById('time');
  var elSec   = document.getElementById('sec');
  var elDate  = document.getElementById('date');
  var elLunar = document.getElementById('lunar');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var lunarKey = '';

  function tick() {
    var d = new Date();
    elTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    elSec.textContent  = ':' + pad(d.getSeconds());

    // 公历一行、农历一行，两行叠着放在时间底下
    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (key !== lunarKey) {
      lunarKey = key;
      var lunar = '';
      try { lunar = (typeof lunarText === 'function') ? lunarText(d) : ''; } catch (e) {}
      elDate.textContent  = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate())
                          + ' ' + WEEK[d.getDay()];
      elLunar.textContent = lunar || ' ';
    }
  }
  tick();
  setInterval(tick, 1000);
})();

/* ═══ ② 天气（Open-Meteo，免费无 key）══════════════════════ */
(function () {
  var CITIES = {
    dt: { name: '大同', lat: 40.0933, lon: 113.2998 },
    sz: { name: '苏州', lat: 31.2989, lon: 120.5853 }
  };
  var WMO = {
    0:'晴', 1:'大部晴', 2:'多云', 3:'阴',
    45:'雾', 48:'雾凇',
    51:'毛毛雨', 53:'小雨', 55:'细密雨',
    56:'冻雨', 57:'冻雨',
    61:'小雨', 63:'中雨', 65:'大雨',
    66:'冻雨', 67:'强冻雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'雪粒',
    80:'阵雨', 81:'阵雨', 82:'强阵雨',
    85:'阵雪', 86:'强阵雪',
    95:'雷阵雨', 96:'雷暴冰雹', 99:'强雷暴冰雹'
  };

  var elTemp = document.getElementById('temp');
  var elDesc = document.getElementById('desc');
  var elHi   = document.getElementById('hi');
  var elLo   = document.getElementById('lo');
  var elFeel = document.getElementById('feel');
  var elHum  = document.getElementById('hum');

  var wanted = new URLSearchParams(location.search).get('city');
  var current = (wanted && CITIES[wanted]) ? wanted : 'dt';

  var cache = {};
  var TTL = 10 * 60 * 1000;

  function fail(msg) {
    elTemp.textContent = '—';
    elDesc.textContent = msg || '暂时读不到天气';
    elHi.textContent = '—'; elLo.textContent = '—';
    elFeel.textContent = '—'; elHum.textContent = '—';
  }

  function render(d, city) {
    var cur = d.current || {};
    var day = d.daily || {};
    elTemp.textContent = Math.round(cur.temperature_2m);
    elDesc.textContent = (WMO[cur.weather_code] || '—') + ' · ' + city.name;

    var hi = Math.round((day.temperature_2m_max || [])[0]);
    var lo = Math.round((day.temperature_2m_min || [])[0]);
    elHi.textContent   = isFinite(hi) ? hi + '°' : '—';
    elLo.textContent   = isFinite(lo) ? lo + '°' : '—';
    elFeel.textContent = Math.round(cur.apparent_temperature) + '°';
    elHum.textContent  = Math.round(cur.relative_humidity_2m) + '%';
  }

  function fetchWeather(key) {
    var city = CITIES[key];
    var hit = cache[key];
    if (hit && Date.now() - hit.at < TTL) { render(hit.data, city); return; }

    elDesc.textContent = '正在读取…';

    var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=' + city.lat + '&longitude=' + city.lon
            + '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m'
            + '&daily=temperature_2m_max,temperature_2m_min'
            + '&timezone=Asia%2FShanghai&forecast_days=1';

    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        cache[key] = { at: Date.now(), data: data };
        render(data, city);
      })
      .catch(function () {
        clearTimeout(timer);
        fail('暂时读不到天气');
      });
  }

  fetchWeather(current);
  setInterval(function () { fetchWeather(current); }, TTL);
})();

/* ═══ ③ 倒计时 ═════════════════════════════════════════════ */
(function () {
  var q = new URLSearchParams(location.search);
  var dateStr = q.get('date') || '2027-06-07';
  var label   = q.get('label') || '高考';

  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(dateStr);
  var target = m
    ? new Date(+m[1], +m[2] - 1, +m[3], 0, 0, 0)
    : new Date(2027, 5, 7, 0, 0, 0);

  document.getElementById('label').textContent = label;
  document.getElementById('target').textContent =
    target.getFullYear() + '.' + ('0' + (target.getMonth() + 1)).slice(-2) + '.' + ('0' + target.getDate()).slice(-2);

  var elDays = document.getElementById('days');
  var elDetail = document.getElementById('detail');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var now = new Date();
    var diff = target - now;
    var past = diff < 0;
    var abs = Math.abs(diff);

    var d  = Math.floor(abs / 864e5);
    var h  = Math.floor(abs % 864e5 / 36e5);
    var mi = Math.floor(abs % 36e5 / 6e4);
    var s  = Math.floor(abs % 6e4 / 1e3);

    elDays.textContent = past ? '−' + d : d;
    elDetail.textContent = (past ? '超出 ' : '余 ') + h + ' 时 ' + pad(mi) + ' 分 ' + pad(s) + ' 秒';
  }
  tick();
  setInterval(tick, 1000);
})();

/* ═══ ④ 今日一句（本地句池，零外部请求）═══════════════════ */

    ['我不是在黑暗中，我是黑暗本身的一部分。', '—'],
    ['哪有什么胜利可言，挺住意味着一切。', '里尔克'],

    ['生活最好的状态是冷冷清清的风风火火。', '木心'],

    ['把今天过完，就是答案的一部分。', '—'],
    ['不必一次想清楚一生，先想清楚这一页。', '—'],
    ['焦虑多半是因为想得太远，而手边的事没做。', '—'],
    ['你只需要把灯打开，黑暗就不能再占满房间。', '—'],

    ['孤独不是身边没人，是没有一个人听得懂你在说什么。', '—'],
    ['休息不是浪费，是让齿轮咬得回去。', '—'],
    ['身体比脑子诚实，累了它先说。', '—'],

    ['难过的时候不要做决定。', '—'],
    ['把标准立在自己身上，别人的评价就只是参考。', '—'],
    ['你已经比你以为的走得更远了。', '—'],
    ['想不通的事先放下，答案常在走路时冒出来。', '—'],
    ['一天里做成一件事就够了。', '—'],
    ['不要在深夜评价自己。', '—'],
    ['不用向任何人证明你在努力。', '—'],
    ['把小事做对，秩序就回来了。', '—'],
    ['能安静待一会儿的人，心里有地方。', '—'],
    ['怕，是因为在乎；怕完了还是要去。', '—'],
    ['所有的笨拙，都是还没熟的手。', '—'],
    ['把话说清楚，比把话说漂亮重要。', '—'],
    ['情绪来了先别动手，它待不了太久。', '—'],
    ['对一个人最深的照顾，是记得他说过的事。', '—'],
    ['你不需要被所有人喜欢，只需要被几个人认真对待。', '—'],
    ['慢慢来，也是一种到。', '—'],
    ['今天不必赢，今天别断。', '—'],
    ['手边有热的东西，就不算太冷。', '—'],
    ['读书是替自己找一些能一起说话的人。', '—']

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var now = new Date();
  var key = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();

  var h = key;
  h = (h ^ 61) ^ (h >>> 16);
  h = h + (h << 3);
  h = h ^ (h >>> 4);
  h = h * 0x27d4eb2d;
  h = h ^ (h >>> 15);

  var item = POOL[Math.abs(h) % POOL.length];
  document.getElementById('text').textContent = item[0];
  document.getElementById('by').textContent = item[1];
  document.getElementById('qdate').textContent =
    now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate());
})();
</script>
