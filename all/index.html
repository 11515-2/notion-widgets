<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总览</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    if (q.get('solid') === '1') document.documentElement.setAttribute('data-solid', '');
  })();
</script>
<style>
  /* ═══ 铺满版 · 四块吃满容器 ══════════════════════════════════════════
     之前 .stage 上挂了个 max-width: 400px —— 容器再宽内容也只长到 400，
     在 Notion 里就等于两头留白、字看着更小。现在全去掉，四个块直接吃满。

     两种形态按容器宽高比自动切：
       宽高比 < 5:2（竖的、方的）  → 上两块并排 + 下两块通栏
       宽高比 ≥ 5:2（扁的）        → 四块横排一行

     字号统一用 min(vh, vw) 双约束 + vmin 兜底，容器放大字就跟着放大，
    容器再小也压不散。 */

  .card { padding: clamp(6px, 1.8vmin, 18px); }

  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(4px, 1.4vmin, 12px);
    text-align: left;
  }

  .blk {
    background: var(--surface);
    border-radius: var(--r-md);
    padding: clamp(5px, 1.9vmin, 16px) clamp(6px, 2vmin, 15px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(1px, .55vmin, 5px);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .pair {
    display: flex;
    align-items: stretch;
    gap: clamp(4px, 1.4vmin, 10px);
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
  }
  .blk--time { flex: 0 0 auto; }
  .blk--wx   { flex: 1 1 auto; }

  .blk--count {
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: clamp(6px, 2vmin, 16px);
    /* 加了生命线后这块被压到 57px，横排内容装不下会竖溢，给个下限兜住 */
    min-height: clamp(48px, 15vmin, 76px);
  }
  .count-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(0px, .35vmin, 3px);
    text-align: right;
    min-width: 0;
  }

  /* ─── 生命线：四行进度（本日/本周/本月/本年）──────────── */
  .life-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: clamp(3px, 1.1vmin, 11px);
    min-width: 0;
  }

  .life-lbl {
    font-size: clamp(7px, min(2.9vh, 3.2vw), 20px);
    font-weight: var(--w-body);
    color: var(--ink-2);
    letter-spacing: .04em;
    white-space: nowrap;
    line-height: 1;
  }

  /* 轨道浓度 45%：跟单独组件一致，浅色深色都到 WCAG 3:1 */
  .life-track {
    position: relative;
    height: clamp(3px, min(1.6vmin, 1vw), 13px);
    background: var(--line-strong);
    background: color-mix(in srgb, var(--ink) 45%, transparent);
    border-radius: 999px;
    overflow: hidden;
    min-width: 0;
  }

  .life-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    min-width: 2px;           /* 极低百分比也要看得见 */
    background: var(--ink);
    border-radius: 999px;
    transition: width .9s linear;
  }

  .life-pct {
    font-size: clamp(7px, min(3.4vh, 3.8vw), 24px);
    font-weight: var(--w-strong);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
    color: var(--ink);
    text-align: right;
    min-width: 3.4em;         /* 100.0% 也要占同样宽，数字不抖 */
    line-height: 1;
  }

  /* 四行均匀排开：块有多高就把四行分多开。
     用 space-evenly 不用 space-between —— between 把首尾两行顶到块的上下边缘
     （星说「本日本年太边缘」）。
     padding-block 和 gap 都归零，间隙全交给 space-evenly 算。
     选择器写成 .blk.blk--life 是必须的：扁排档里有 `.blk { padding: … }`，
     单类选择器同优先级、后出现会把它覆盖回去，首尾就会比中间多出一截。 */
  .blk.blk--life {
    justify-content: space-evenly;
    padding-block: 0;
    /* 左右留白比别的块大一点：标签原来离块的左边缘只有 5px，贴着边不动看 */
    padding-inline: clamp(9px, 3vmin, 26px);
    gap: 0;
    flex: 1 1 auto;      /* 竖排档也要分到高度，不然四行刚好撑满、一点间隙都没有 */
  }

  /* ─── 字级：主数字一套，其余全挂 .sub ──────────────────── */
  .num {
    display: flex;
    align-items: baseline;
    gap: clamp(1px, .6vmin, 6px);
    line-height: .92;
    color: var(--ink);
    font-weight: var(--w-strong);
    letter-spacing: -.03em;
  }

  /* 三个主数字：跟容器同步放大，上限放到 130 不封顶得太早 */
  #time { font-size: clamp(16px, min(10.2vh, 14vw), 120px); }
  #sec  { font-size: clamp(10px, min(5.1vh, 7vw), 60px); color: var(--ink-3); }
  #temp { font-size: clamp(13px, min(7.2vh, 10vw), 84px); }
  #days { font-size: clamp(15px, min(8.2vh, 11.5vw), 96px); }

  .unit, .deg {
    font-size: clamp(8px, min(3.4vh, 4.2vw), 30px);
    color: var(--ink-3);
    letter-spacing: .06em;
  }

  .sub {
    font-size: clamp(7px, min(2.7vh, 3.3vw), 18px);
    color: var(--ink-3);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .sub b { color: var(--ink-2); font-weight: var(--w-body); }
  .sub--main { color: var(--ink-2); }

  #text {
    margin: 0;
    font-size: clamp(9px, min(3.9vh, 4.8vw), 34px);
    line-height: 1.5;
    font-weight: var(--w-strong);
    color: var(--ink);
    min-width: 0;
    text-wrap: pretty;
  }
  .by-row {
    display: flex;
    align-items: baseline;
    gap: clamp(3px, 1vmin, 10px);
    margin-top: clamp(1px, .7vmin, 7px);
  }
  #by { color: var(--ink-2); }

  /* ─── 横向偏方（3/2 ~ 22/10）：时间块当主角 + 中间上下两块 + 最右生命线 ───
     四等分最呆板 —— 四块一样大、一样重，眼睛不知道先看哪儿。
     所以时间块跨两行占 1.75 倍宽，天气和倒计时在中间上下排，
     生命线在最右单独一列（也跨两行），引文收底通栏。

     下限从 6/5 提到 3/2：五块挤在 600×420 这种偏方的框里，中列只剩 137 宽，
     生命线的进度条会被压到 40 多像素。那种比例让它走竖排档更好看。 */
  @media (min-aspect-ratio: 3/2) and (max-aspect-ratio: 22/10) {
    .stage {
      display: grid;
      grid-template-columns: 1.55fr 1fr 1.15fr;
      grid-template-rows: 1fr 1fr auto;
      grid-template-areas:
        "time  wx     life"
        "time  count  life"
        "quote quote  quote";
      gap: clamp(4px, 1.3vmin, 13px);
    }
    .pair { display: contents; }

    .blk--time  { grid-area: time; }
    .blk--wx    { grid-area: wx; }
    .blk--count { grid-area: count; }
    .blk--life  { grid-area: life; }
    .blk--quote { grid-area: quote; }

    /* 中列只剩 159~204 宽，「高考 · 2027.06.07」这 15 个字放不下，
       绝对日期在这个尺寸里没什么用（上面已经有 217 天了），窄档直接藏掉，
       只留标签和剩余时分秒 */
    .blk--count .sep,
    .blk--count #target { display: none; }

    /* 倒计时块在这个档只有 280 宽，塞左右两组会断开一大段空隙 ——
       改成竖排左对齐，跟上面天气块同一个呼吸节奏 */
    .blk--count {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(1px, .5vmin, 5px);
    }
    .count-right {
      align-items: flex-start;
      text-align: left;
      gap: clamp(0px, .3vmin, 2px);
    }

    /* 时间块是主角，但要把宽度让一点给生命线：1.75fr 收到 1.55fr，
       710×393 时约 281 宽、内宽 265，8 个字符按等宽 0.617em 算，
       字号上限 ≈ 265/4.94 ≈ 53px，取 12vmin/7.4vw 卡在里面。 */
    #time { font-size: clamp(15px, min(12vmin, 7.4vw), 72px); }
    #sec  { font-size: clamp(9px,  min(6vmin, 3.7vw), 36px); }
    #temp { font-size: clamp(12px, min(9vmin, 6vw), 62px); }
    #days { font-size: clamp(13px, min(9.5vmin, 6.4vw), 66px); }
    .unit, .deg { font-size: clamp(8px, min(4vmin, 2.8vw), 22px); }
    /* 「余 10 时 22 分 49 秒」12 个字，得压到中列内宽以内 */
    .sub  { font-size: clamp(6px, min(2.85vmin, 1.85vw), 12px); }
    #text { font-size: clamp(9px, min(4.2vmin, 3vw), 26px); }
  }

  /* ─── 扁容器：四块横排一行，各自按比例分宽度 ─────────────
     Notion 的 embed 拖成很扁的时候（宽高比 2.5 以上）。 */
  @media (min-aspect-ratio: 5/2) {
    .stage {
      flex-direction: row;
      align-items: stretch;
      gap: clamp(4px, 1vmin, 10px);
    }
    .pair { display: contents; }        /* 拆掉包裹层，四块直接并排 */

    .blk--time  { flex: 2.2 1 0; }
    .blk--wx    { flex: 1.25 1 0; }
    .blk--count { flex: 1.7 1 0; flex-direction: column; align-items: flex-start; justify-content: center; }
    .blk--life  { flex: 1.45 1 0; }
    .blk--quote { flex: 1.9 1 0; }

    .count-right { align-items: flex-start; text-align: left; }

    /* 扁框里高度就是瓶颈，全部按 vh 定，把纵向空间吃满 */
    #time { font-size: clamp(13px, 15.5vh, 72px); }
    #sec  { font-size: clamp(9px, 8.5vh, 34px); }
    #temp { font-size: clamp(11px, 12vh, 50px); }
    #days { font-size: clamp(12px, 13.5vh, 56px); }
    .unit, .deg { font-size: clamp(7px, 6vh, 22px); }
    .sub  { font-size: clamp(6px, 5vh, 13px); }
    #text { font-size: clamp(7px, 5.4vh, 15px); line-height: 1.35; }
    .blk  { padding: clamp(4px, 4.5vh, 14px) clamp(5px, 1.6vmin, 14px); }
  }

  /* 极窄竖屏：只压字号，结构不动 */
  @media (max-width: 280px) {
    #time { font-size: clamp(14px, 11vw, 60px); }
    #temp { font-size: clamp(12px, 8vw, 40px); }
    #days { font-size: clamp(13px, 9vw, 46px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <!-- 上半：时间块 + 天气块 -->
      <div class="pair">

        <div class="blk blk--time">
          <div class="num"><span id="time">--:--</span><span id="sec">:--</span></div>
          <span id="date" class="sub sub--main">—</span>
          <span id="lunar" class="sub">—</span>
          <span id="festival" class="sub">—</span>
        </div>

        <div class="blk blk--wx">
          <div class="num"><span id="temp">—</span><span class="deg">°C</span></div>
          <span id="desc" class="sub sub--main">正在读取…</span>
          <span class="sub">最高<b id="hi">—</b>　最低<b id="lo">—</b></span>
          <span class="sub">体感<b id="feel">—</b>　湿度<b id="hum">—</b></span>
        </div>

      </div>

      <!-- 中段：倒计时 -->
      <div class="blk blk--count">
        <div class="num"><span id="days">—</span><span class="unit">天</span></div>
        <div class="count-right">
          <span class="sub sub--main"><span id="label">—</span><span class="sep"> · </span><span id="target">—</span></span>
          <span id="detail" class="sub">—</span>
        </div>
      </div>

      <!-- 生命线：本日 / 本周 / 本月 / 本年 -->
      <div class="blk blk--life">
        <div class="life-row"><span class="life-lbl">本日</span><span class="life-track"><i class="life-fill" id="lf0"></i></span><span class="life-pct" id="lp0">—</span></div>
        <div class="life-row"><span class="life-lbl">本周</span><span class="life-track"><i class="life-fill" id="lf1"></i></span><span class="life-pct" id="lp1">—</span></div>
        <div class="life-row"><span class="life-lbl">本月</span><span class="life-track"><i class="life-fill" id="lf2"></i></span><span class="life-pct" id="lp2">—</span></div>
        <div class="life-row"><span class="life-lbl">本年</span><span class="life-track"><i class="life-fill" id="lf3"></i></span><span class="life-pct" id="lp3">—</span></div>
      </div>

      <!-- 底部：今日一句 -->
      <div class="blk blk--quote">
        <p id="text">—</p>
        <div class="by-row">
          <span id="by" class="sub">—</span>
        </div>
      </div>

    </div>
  </div>
<script src="../assets/lunar.js"></script>
<script>
/* ═══ ① 时钟 ═══════════════════════════════════════════════ */
(function () {
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  var elTime  = document.getElementById('time');
  var elSec   = document.getElementById('sec');
  var elDate  = document.getElementById('date');
  var elLunar = document.getElementById('lunar');
  var elFest  = document.getElementById('festival');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ── 只看这五个重要节日：公历三个、农历两个 ──────────────
  var FEST = [
    { type: 'solar', m: 10, d: 1,  name: '国庆'   },
    { type: 'solar', m: 10, d: 31, name: '万圣节' },
    { type: 'solar', m: 12, d: 25, name: '圣诞'   },
    { type: 'lunar', m: 8,  d: 15, name: '中秋'   },
    { type: 'lunar', m: 1,  d: 1,  name: '春节'   }
  ];

  /* 从今天起往后找最近的一个节日；农历节日靠 toLunar 逐日试出来 */
  function nextFestival(from) {
    var y = from.getFullYear(), mo = from.getMonth(), da = from.getDate();
    for (var i = 0; i <= 420; i++) {
      var d = new Date(y, mo, da + i);
      for (var k = 0; k < FEST.length; k++) {
        var f = FEST[k];
        if (f.type === 'solar') {
          if (d.getMonth() + 1 === f.m && d.getDate() === f.d) return { name: f.name, days: i };
        } else if (typeof toLunar === 'function') {
          var l = toLunar(d);
          if (!l.leap && l.m === f.m && l.d === f.d) return { name: f.name, days: i };
        }
      }
    }
    return null;
  }

  var lastKey = '';

  function tick() {
    var d = new Date();
    elTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    elSec.textContent  = ':' + pad(d.getSeconds());

    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (key !== lastKey) {
      lastKey = key;
      var lunar = '';
      try { lunar = (typeof lunarText === 'function') ? lunarText(d) : ''; } catch (e) {}
      elDate.textContent  = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate())
                          + ' ' + WEEK[d.getDay()];
      elLunar.textContent = lunar || ' ';

      // 距下一个重要节日（一天只算一次）
      if (elFest) {
        try {
          var f = nextFestival(d);
          // 交给引文块用：今天是节日就别再让接口随机了
          window.__todayFest = (f && f.days === 0) ? f.name : '';
          elFest.textContent = !f ? ' '
            : f.days === 0 ? '今天 · ' + f.name
            : f.days === 1 ? '明天 · ' + f.name
            : '距' + f.name + ' ' + f.days + ' 天';
        } catch (e2) { elFest.textContent = ' '; window.__todayFest = ''; }
      }
    }
  }
  tick();
  setInterval(tick, 1000);
})();

/* ═══ ② 天气（Open-Meteo，免费无 key）══════════════════════ */
(function () {
  var CITIES = {
    dt: { name: '大同', lat: 40.0933, lon: 113.2998 },
    sz: { name: '苏州', lat: 31.2989, lon: 120.5853 }
  };
  var WMO = {
    0:'晴', 1:'大部晴', 2:'多云', 3:'阴',
    45:'雾', 48:'雾凇',
    51:'毛毛雨', 53:'小雨', 55:'细密雨',
    56:'冻雨', 57:'冻雨',
    61:'小雨', 63:'中雨', 65:'大雨',
    66:'冻雨', 67:'强冻雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'雪粒',
    80:'阵雨', 81:'阵雨', 82:'强阵雨',
    85:'阵雪', 86:'强阵雪',
    95:'雷阵雨', 96:'雷暴冰雹', 99:'强雷暴冰雹'
  };

  var elTemp = document.getElementById('temp');
  var elDesc = document.getElementById('desc');
  var elHi   = document.getElementById('hi');
  var elLo   = document.getElementById('lo');
  var elFeel = document.getElementById('feel');
  var elHum  = document.getElementById('hum');

  var wanted = new URLSearchParams(location.search).get('city');
  var current = (wanted && CITIES[wanted]) ? wanted : 'dt';

  var cache = {};
  var TTL = 10 * 60 * 1000;

  function fail(msg) {
    elTemp.textContent = '—';
    elDesc.textContent = msg || '暂时读不到天气';
    elHi.textContent = '—'; elLo.textContent = '—';
    elFeel.textContent = '—'; elHum.textContent = '—';
  }

  function render(d, city) {
    var cur = d.current || {};
    var day = d.daily || {};
    elTemp.textContent = Math.round(cur.temperature_2m);
    elDesc.textContent = (WMO[cur.weather_code] || '—') + ' · ' + city.name;

    var hi = Math.round((day.temperature_2m_max || [])[0]);
    var lo = Math.round((day.temperature_2m_min || [])[0]);
    elHi.textContent   = isFinite(hi) ? hi + '°' : '—';
    elLo.textContent   = isFinite(lo) ? lo + '°' : '—';
    elFeel.textContent = Math.round(cur.apparent_temperature) + '°';
    elHum.textContent  = Math.round(cur.relative_humidity_2m) + '%';
  }

  function fetchWeather(key) {
    var city = CITIES[key];
    var hit = cache[key];
    if (hit && Date.now() - hit.at < TTL) { render(hit.data, city); return; }

    elDesc.textContent = '正在读取…';

    var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=' + city.lat + '&longitude=' + city.lon
            + '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m'
            + '&daily=temperature_2m_max,temperature_2m_min'
            + '&timezone=Asia%2FShanghai&forecast_days=1';

    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        cache[key] = { at: Date.now(), data: data };
        render(data, city);
      })
      .catch(function () {
        clearTimeout(timer);
        fail('暂时读不到天气');
      });
  }

  fetchWeather(current);
  setInterval(function () { fetchWeather(current); }, TTL);
})();

/* ═══ ③ 倒计时 ═════════════════════════════════════════════ */
(function () {
  var q = new URLSearchParams(location.search);
  var dateStr = q.get('date') || '2027-06-07';
  var label   = q.get('label') || '高考';

  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(dateStr);
  var target = m
    ? new Date(+m[1], +m[2] - 1, +m[3], 0, 0, 0)
    : new Date(2027, 5, 7, 0, 0, 0);

  document.getElementById('label').textContent = label;
  document.getElementById('target').textContent =
    target.getFullYear() + '.' + ('0' + (target.getMonth() + 1)).slice(-2) + '.' + ('0' + target.getDate()).slice(-2);

  var elDays = document.getElementById('days');
  var elDetail = document.getElementById('detail');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var now = new Date();
    var diff = target - now;
    var past = diff < 0;
    var abs = Math.abs(diff);

    var d  = Math.floor(abs / 864e5);
    var h  = Math.floor(abs % 864e5 / 36e5);
    var mi = Math.floor(abs % 36e5 / 6e4);
    var s  = Math.floor(abs % 6e4 / 1e3);

    elDays.textContent = past ? '−' + d : d;
    var tail = (h > 0 ? h + ' 时 ' : '') + pad(mi) + ' 分 ' + pad(s) + ' 秒';
    elDetail.textContent = (past ? '超 ' : '余 ') + tail;
  }
  tick();
  setInterval(tick, 1000);
})();

  /* 每半小时换一句。诗句来自「今日诗词」开放接口：
       GET https://v1.jinrishici.com/all.json
       返回 { content, author, origin, category }，免费、无需 key、
       响应头 access-control-allow-origin: * —— 浏览器能直连。
     接口万一挂了就落回上面这个本地句池，界面永远不会空。

     刷新节奏：时间切成 30 分钟一格，跨格才重新取；
     每 15 秒对一次表，到点立刻换，不靠 setInterval(30min) 慢慢漂。 */
  var SLOT_MS = 30 * 60 * 1000;
  var POEM_API = 'https://v1.jinrishici.com/all.json';

  function slotHash(slot) {
    var h = slot;
    h = (h ^ 61) ^ (h >>> 16);
    h = h + (h << 3);
    h = h ^ (h >>> 4);
    h = h * 0x27d4eb2d;
    h = h ^ (h >>> 15);
    return Math.abs(h) % POOL.length;
  }

  var elText = document.getElementById('text');
  var elBy   = document.getElementById('by');
  var curSlot = -1;

  function renderLocal(slot) {
    var item = POOL[slotHash(slot)];
    elText.textContent = item[0];
    elBy.textContent = item[1];
  }

  /* 节日当天不走接口，直接用本地配好的诗句 —— 确定性优先。
     今日诗词的 all.json 实测 20 次里只有 2 次是节日类（10%），
     节日当天靠它随机，八成给不到该节日的诗。 */
  var FESTIVAL_POEMS = {
    '春节': [
      ['爆竹声中一岁除，春风送暖入屠苏。', '王安石 · 元日'],

    ],
    '国庆': [

      ['黄河远上白云间，一片孤城万仞山。', '王之涣 · 凉州词'],
      ['大漠孤烟直，长河落日圆。', '王维 · 使至塞上']
    ],
    '万圣节': [
      ['银烛秋光冷画屏，轻罗小扇扑流萤。', '杜牧 · 秋夕'],
      ['秋风清，秋月明，落叶聚还散。', '李白 · 秋风词'],
      ['露湿秋香满池岸，由来不羡瓦松高。', '郑谷 · 菊']
    ],
    '圣诞': [
      ['忽如一夜春风来，千树万树梨花开。', '岑参 · 白雪歌送武判官归京'],

      ['孤舟蓑笠翁，独钓寒江雪。', '柳宗元 · 江雪']
    ]
  };

  function render() {
    var slot = Math.floor(Date.now() / SLOT_MS);
    if (slot === curSlot) return;
    curSlot = slot;

    // ① 节日当天：本地节日诗，不出网，确定命中
    var fest = window.__todayFest || '';
    var fp = FESTIVAL_POEMS[fest];
    if (fp && fp.length) {
      var p = fp[slot % fp.length];
      elText.textContent = p[0];
      elBy.textContent = p[1];
      return;
    }

    // ② 平时：取今日诗词
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);

    fetch(POEM_API, ctrl ? { signal: ctrl.signal, cache: 'no-store' } : { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || !d.content) throw new Error('empty');
        elText.textContent = d.content;

        if (d.author) meta.push(d.author);

/* ═══ ⑤ 生命线：本日 / 本周 / 本月 / 本年 已过进度 ══════════ */
(function () {
  var fills = [
    document.getElementById('lf0'), document.getElementById('lf1'),
    document.getElementById('lf2'), document.getElementById('lf3')
  ];
  var pcts = [
    document.getElementById('lp0'), document.getElementById('lp1'),
    document.getElementById('lp2'), document.getElementById('lp3')
  ];
  if (!fills[0]) return;

  /* 四段区间都用 Date 构造，月长闰年交给浏览器，不手算毫秒 */
  function spans(now) {
    var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    var dayStart = new Date(y, m, d), dayEnd = new Date(y, m, d + 1);
    var dow = (dayStart.getDay() + 6) % 7;            // 周一=0
    var weekStart = new Date(y, m, d - dow), weekEnd = new Date(y, m, d - dow + 7);
    var monthStart = new Date(y, m, 1), monthEnd = new Date(y, m + 1, 1);
    var yearStart = new Date(y, 0, 1), yearEnd = new Date(y + 1, 0, 1);
    return [[dayStart, dayEnd], [weekStart, weekEnd],
            [monthStart, monthEnd], [yearStart, yearEnd]];
  }

  function tickLife() {
    var now = new Date(), t = now.getTime(), s = spans(now);
    for (var i = 0; i < 4; i++) {
      var total = s[i][1] - s[i][0];
      if (!(total > 0)) continue;
      var r = (t - s[i][0]) / total;
      r = r < 0 ? 0 : r > 1 ? 1 : r;
      var p = r * 100;
      fills[i].style.width = p.toFixed(2) + '%';
      pcts[i].textContent = (p >= 99.995 ? '100' : p.toFixed(1)) + '%';
    }
  }

  tickLife();
  setInterval(tickLife, 1000);
})();
