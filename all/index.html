<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总览</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    if (q.get('solid') === '1') document.documentElement.setAttribute('data-solid', '');
  })();
</script>
<style>
  /* ═══ 窄高版 · 三阶明暗 ════════════════════════════════════════════
     上一版一屏里堆了 5 个小胶囊（日期、天气状况、高考、目标日、剩余时间）。
     胶囊是拿来做强调的，处处都是就没有重点，整屏像贴满标签的箱子。

     这一版把胶囊全撤了，只用三样东西分层：
       大小   时间 / 温度 / 天数 —— 三个主数字压住视线
       明暗   主信息 --ink，辅助 --ink-2，最次要 --ink-3
       疏密   段间一道居中的短细线，不是通栏横杠（通栏像表格）

     三段视觉重量约 45 : 30 : 25，不再头重脚轻。 */

  .card { padding: clamp(12px, 2.4vh, 22px) clamp(14px, 3.4vw, 28px); }

  .stage {
    height: 100%;
    width: 100%;
    max-width: min(100%, 400px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;      /* 一条左轴贯穿到底，边缘不再呈锯齿 */
    gap: clamp(16px, 4vh, 34px);  /* 段间距拉大，三组才分得开 */
    text-align: left;
  }

  .seg {
    position: relative;
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(3px, .75vh, 7px);   /* 段内收紧，跟段间的 16~34px 拉开层次 */
    padding: clamp(4px, 1.1vh, 11px) 0;
  }

  /* 分隔线：贴左的一小段，跟左轴同起点。通栏横杠会把窄列切成表格 */
  .seg + .seg::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: clamp(18px, 6%, 30px);
    height: 1px;
    background: var(--line-strong);
  }

  /* ─── ① 时间 ─────────────────────────────────────────── */
  .time-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(2px, .8vw, 6px);
    line-height: .92;
    color: var(--ink);
    font-weight: var(--w-strong);
    letter-spacing: -.03em;
  }
  #time { font-size: clamp(26px, min(11.5vh, 12.5vw), 110px); }
  #sec  { font-size: clamp(13px, min(5.75vh, 6.25vw), 55px); color: var(--ink-3); }

  #date {
    font-size: clamp(10px, min(2.35vh, 3vw), 14px);
    color: var(--ink-2);
    letter-spacing: .02em;
  }

  /* ─── ① 天气：状况小字贴在温度左边，四项小字沉到最下 ──────── */
  .weather-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(6px, 1.8vw, 13px);
    flex-wrap: wrap;
  }
  #desc {
    font-size: clamp(10px, min(2.5vh, 3.1vw), 15px);
    color: var(--ink-2);
    letter-spacing: .02em;
  }
  .temp-row {
    display: flex;
    align-items: baseline;
    line-height: .92;
    color: var(--ink);
    font-weight: var(--w-strong);
    letter-spacing: -.03em;
  }
  #temp { font-size: clamp(18px, min(8vh, 9.2vw), 82px); }
  .deg  {
    font-size: clamp(8px, min(2.8vh, 3.2vw), 30px);
    color: var(--ink-3);
    margin-left: .08em;
  }

  /* 四项横排：不占块、不加竖线，只靠字距分开 */
  .mini {
    display: flex;
    align-items: baseline;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(6px, 2vw, 15px);
    font-size: clamp(9px, min(2.3vh, 2.9vw), 13px);
    color: var(--ink-3);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .mini span { display: flex; align-items: baseline; gap: .28em; }
  .mini b { color: var(--ink-2); font-weight: var(--w-body); }

  /* ─── ② 倒计时 ──────────────────────────────────────── */
  .count-caption {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(4px, 1.2vw, 9px);
    font-size: clamp(10px, min(2.35vh, 3vw), 14px);
    color: var(--ink-3);
    letter-spacing: .02em;
    flex-wrap: wrap;
  }
  #label { color: var(--ink-2); }
  .count-caption i { font-style: normal; opacity: .55; }

  .days-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(3px, .9vw, 8px);
    line-height: .92;
    color: var(--ink);
    font-weight: var(--w-strong);
    letter-spacing: -.03em;
  }
  #days { font-size: clamp(22px, min(9vh, 10.5vw), 88px); }
  .unit {
    font-size: clamp(10px, min(3.6vh, 4vw), 26px);
    color: var(--ink-3);
    letter-spacing: .08em;
  }

  #detail {
    font-size: clamp(9px, min(2.3vh, 2.9vw), 13px);
    color: var(--ink-3);
    letter-spacing: .02em;
  }

  /* ─── ③ 引文 ────────────────────────────────────────── */
  #text {
    margin: 0;
    font-size: clamp(11px, min(3.5vh, 4.4vw), 25px);
    line-height: 1.6;
    font-weight: var(--w-strong);
    color: var(--ink);
    min-width: 0;
    text-wrap: balance;
  }
  .by-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(5px, 1.2vw, 10px);
    font-size: clamp(9px, min(2.3vh, 2.9vw), 13px);
    color: var(--ink-3);
    white-space: nowrap;
  }
  .by-row b { color: var(--ink-2); font-weight: var(--w-body); }

  /* 极窄时只压字号，布局不动（本来就是单列） */
  @media (max-width: 300px) {
    #time { font-size: clamp(22px, 12vw, 70px); }
    #temp { font-size: clamp(16px, 9vw, 56px); }
    #days { font-size: clamp(20px, 10vw, 60px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <!-- ① 时间 · 日期 · 天气 -->
      <div class="seg">
        <div class="time-row">
          <span id="time">--:--</span><span id="sec">:--</span>
        </div>
        <div id="date">—</div>

        <div class="weather-line">
          <span id="desc">正在读取…</span>
          <div class="temp-row"><span id="temp">—</span><span class="deg">°C</span></div>
        </div>

        <div class="mini">
          <span>最高<b id="hi">—</b></span>
          <span>最低<b id="lo">—</b></span>
          <span>体感<b id="feel">—</b></span>
          <span>湿度<b id="hum">—</b></span>
        </div>
      </div>

      <!-- ② 倒计时 -->
      <div class="seg">
        <div class="count-caption">
          <span id="label">—</span><i>·</i><span id="target">—</span>
        </div>
        <div class="days-row"><span id="days">—</span><span class="unit">天</span></div>
        <div id="detail">—</div>
      </div>

      <!-- ③ 今日一句 -->
      <div class="seg">
        <p id="text">—</p>
        <div class="by-row">
          <b id="by">—</b>
          <span id="qdate">—</span>
        </div>
      </div>

    </div>
  </div>

<script src="../assets/lunar.js"></script>
<script>
/* ═══ ① 时钟 ═══════════════════════════════════════════════ */
(function () {
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  var elTime = document.getElementById('time');
  var elSec  = document.getElementById('sec');
  var elDate = document.getElementById('date');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var lunarKey = '';

  function tick() {
    var d = new Date();
    elTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    elSec.textContent  = ':' + pad(d.getSeconds());

    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (key !== lunarKey) {
      lunarKey = key;
      var lunar = '';
      try { lunar = (typeof lunarText === 'function') ? lunarText(d) : ''; } catch (e) {}
      elDate.textContent = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate())
                         + ' ' + WEEK[d.getDay()] + (lunar ? '　' + lunar : '');
    }
  }
  tick();
  setInterval(tick, 1000);
})();

/* ═══ ② 天气（Open-Meteo，免费无 key）══════════════════════ */
(function () {
  var CITIES = {
    dt: { name: '大同', lat: 40.0933, lon: 113.2998 },
    sz: { name: '苏州', lat: 31.2989, lon: 120.5853 }
  };
  var WMO = {
    0:'晴', 1:'大部晴', 2:'多云', 3:'阴',
    45:'雾', 48:'雾凇',
    51:'毛毛雨', 53:'小雨', 55:'细密雨',
    56:'冻雨', 57:'冻雨',
    61:'小雨', 63:'中雨', 65:'大雨',
    66:'冻雨', 67:'强冻雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'雪粒',
    80:'阵雨', 81:'阵雨', 82:'强阵雨',
    85:'阵雪', 86:'强阵雪',
    95:'雷阵雨', 96:'雷暴冰雹', 99:'强雷暴冰雹'
  };

  var elTemp = document.getElementById('temp');
  var elDesc = document.getElementById('desc');
  var elHi   = document.getElementById('hi');
  var elLo   = document.getElementById('lo');
  var elFeel = document.getElementById('feel');
  var elHum  = document.getElementById('hum');

  var wanted = new URLSearchParams(location.search).get('city');
  var current = (wanted && CITIES[wanted]) ? wanted : 'dt';

  var cache = {};
  var TTL = 10 * 60 * 1000;

  function fail(msg) {
    elTemp.textContent = '—';
    elDesc.textContent = msg || '暂时读不到天气';
    elHi.textContent = '—'; elLo.textContent = '—';
    elFeel.textContent = '—'; elHum.textContent = '—';
  }

  function render(d, city) {
    var cur = d.current || {};
    var day = d.daily || {};
    elTemp.textContent = Math.round(cur.temperature_2m);
    elDesc.textContent = (WMO[cur.weather_code] || '—') + ' · ' + city.name;

    var hi = Math.round((day.temperature_2m_max || [])[0]);
    var lo = Math.round((day.temperature_2m_min || [])[0]);
    elHi.textContent   = isFinite(hi) ? hi + '°' : '—';
    elLo.textContent   = isFinite(lo) ? lo + '°' : '—';
    elFeel.textContent = Math.round(cur.apparent_temperature) + '°';
    elHum.textContent  = Math.round(cur.relative_humidity_2m) + '%';
  }

  function fetchWeather(key) {
    var city = CITIES[key];
    var hit = cache[key];
    if (hit && Date.now() - hit.at < TTL) { render(hit.data, city); return; }

    elDesc.textContent = '正在读取…';

    var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=' + city.lat + '&longitude=' + city.lon
            + '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m'
            + '&daily=temperature_2m_max,temperature_2m_min'
            + '&timezone=Asia%2FShanghai&forecast_days=1';

    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        cache[key] = { at: Date.now(), data: data };
        render(data, city);
      })
      .catch(function () {
        clearTimeout(timer);
        fail('暂时读不到天气');
      });
  }

  fetchWeather(current);
  setInterval(function () { fetchWeather(current); }, TTL);
})();

/* ═══ ③ 倒计时 ═════════════════════════════════════════════ */
(function () {
  var q = new URLSearchParams(location.search);
  var dateStr = q.get('date') || '2027-06-07';
  var label   = q.get('label') || '高考';

  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(dateStr);
  var target = m
    ? new Date(+m[1], +m[2] - 1, +m[3], 0, 0, 0)
    : new Date(2027, 5, 7, 0, 0, 0);

  document.getElementById('label').textContent = label;
  document.getElementById('target').textContent =
    target.getFullYear() + '.' + ('0' + (target.getMonth() + 1)).slice(-2) + '.' + ('0' + target.getDate()).slice(-2);

  var elDays = document.getElementById('days');
  var elDetail = document.getElementById('detail');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var now = new Date();
    var diff = target - now;
    var past = diff < 0;
    var abs = Math.abs(diff);

    var d  = Math.floor(abs / 864e5);
    var h  = Math.floor(abs % 864e5 / 36e5);
    var mi = Math.floor(abs % 36e5 / 6e4);
    var s  = Math.floor(abs % 6e4 / 1e3);

    elDays.textContent = past ? '−' + d : d;
    elDetail.textContent = (past ? '超出 ' : '余 ') + h + ' 时 ' + pad(mi) + ' 分 ' + pad(s) + ' 秒';
  }
  tick();
  setInterval(tick, 1000);
})();

    ['情绪来了先别动手，它待不了太久。', '—'],
    ['对一个人最深的照顾，是记得他说过的事。', '—'],
    ['你不需要被所有人喜欢，只需要被几个人认真对待。', '—'],
    ['慢慢来，也是一种到。', '—'],

    ['读书是替自己找一些能一起说话的人。', '—']

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var now = new Date();
  var key = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();

  var h = key;
  h = (h ^ 61) ^ (h >>> 16);
  h = h + (h << 3);
  h = h ^ (h >>> 4);

  h = h ^ (h >>> 15);

  var item = POOL[Math.abs(h) % POOL.length];
  document.getElementById('text').textContent = item[0];
