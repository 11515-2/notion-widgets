<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时钟</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    if (q.get('solid') === '1') document.documentElement.setAttribute('data-solid', '');
  })();
</script>
<style>
  /* 主字号存成变量，秒数取它的一半 —— 用 em 会按 body 16px 算，出不来一半 */
  .card { --big: clamp(40px, min(38vh, 19vw), 200px); }
  #time { font-size: var(--big); }
  #sec  { font-size: calc(var(--big) * .5); }
</style>
</head>
<body>
  <div class="card">
    <div class="main">
      <div class="block">
        <p class="display" id="time">--:--</p><span class="sec" id="sec">:--</span>
      </div>
      <span class="chip chip--strong" id="date">—</span>
      <span class="chip" id="festival">—</span>
    </div>
  </div>

<script src="../assets/lunar.js"></script>
<script>
(function () {
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  var elTime = document.getElementById('time');
  var elSec  = document.getElementById('sec');
  var elDate = document.getElementById('date');
  var elFest = document.getElementById('festival');

  /* 只看这五个重要节日：公历三个、农历两个。
     公历直接比月日；农历靠 toLunar 逐日往后试，最多扫 420 天。 */
  var FEST = [
    { type: 'solar', m: 10, d: 1,  name: '国庆'   },
    { type: 'solar', m: 10, d: 31, name: '万圣节' },
    { type: 'solar', m: 12, d: 25, name: '圣诞'   },
    { type: 'lunar', m: 8,  d: 15, name: '中秋'   },
    { type: 'lunar', m: 1,  d: 1,  name: '春节'   }
  ];

  function nextFestival(from) {
    var y = from.getFullYear(), mo = from.getMonth(), da = from.getDate();
    for (var i = 0; i <= 420; i++) {
      var d = new Date(y, mo, da + i);
      for (var k = 0; k < FEST.length; k++) {
        var f = FEST[k];
        if (f.type === 'solar') {
          if (d.getMonth() + 1 === f.m && d.getDate() === f.d) return { name: f.name, days: i };
        } else if (typeof toLunar === 'function') {
          var l = toLunar(d);
          if (!l.leap && l.m === f.m && l.d === f.d) return { name: f.name, days: i };
        }
      }
    }
    return null;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  var lunarKey = '';

  function tick() {
    var d = new Date();
    elTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    elSec.textContent  = ':' + pad(d.getSeconds());

    // 农历一天才变一次，算一次缓存住
    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (key !== lunarKey) {
      lunarKey = key;
      var lunar = '';
      try { lunar = (typeof lunarText === 'function') ? lunarText(d) : ''; } catch (e) {}
      elDate.textContent = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate())
                         + ' ' + WEEK[d.getDay()] + (lunar ? '　' + lunar : '');

      if (elFest) {
        try {
          var f = nextFestival(d);
          elFest.textContent = !f ? ' '
            : f.days === 0 ? '今天 · ' + f.name
            : f.days === 1 ? '明天 · ' + f.name
            : '距' + f.name + ' ' + f.days + ' 天';
        } catch (e2) { elFest.textContent = ' '; }
      }
    }
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
