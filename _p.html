<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="./all/?theme=dark" style="width:400px;height:560px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var d = document.getElementById('f').contentDocument;
    var L = [];
    var cols = d.querySelectorAll('.col');
    var l = cols[0].getBoundingClientRect(), r = cols[1].getBoundingClientRect();
    L.push('左列 x=' + Math.round(l.left) + '..' + Math.round(l.right) + ' 宽' + Math.round(l.width));
    L.push('右列 x=' + Math.round(r.left) + '..' + Math.round(r.right) + ' 宽' + Math.round(r.width));
    L.push('两列间距 ' + Math.round(r.left - l.right) + 'px');
    L.push('');
    L.push('左列 ' + cols[0].children.length + ' 行 / 右列 ' + cols[1].children.length + ' 行');
    L.push('左列高 ' + Math.round(l.height) + '  右列高 ' + Math.round(r.height) + '  错开 ' + Math.round(r.height - l.height) + 'px');
    L.push('');
    // 两个大数字的基线：比较 .num 内文字底部
    var t = d.querySelector('#time').getBoundingClientRect();
    var tp = d.querySelector('#temp').getBoundingClientRect();
    L.push('时间底 ' + Math.round(t.bottom) + '  温度底 ' + Math.round(tp.bottom) + '  基线差 ' + Math.round(Math.abs(t.bottom - tp.bottom)) + 'px');
    L.push('');
    var ov = [];
    ['col','num','sub','quote','text'].forEach(function (c) {
      var els = d.querySelectorAll('.' + c);
      for (var i = 0; i < els.length; i++) {
        var e = els[i];
        if (e.scrollWidth > e.clientWidth + 1) ov.push('.' + c + '[' + i + '] 横+' + (e.scrollWidth - e.clientWidth));
      }
    });
    L.push('横向溢出: ' + (ov.length ? ov.join(', ') : '无'));
    var card = d.querySelector('.card').getBoundingClientRect();
    var q = d.querySelector('.quote').getBoundingClientRect();
    L.push('上留白 ' + Math.round(l.top - card.top) + ' 下留白 ' + Math.round(card.bottom - q.bottom));
    var sz = function (s) { var e = d.querySelector(s); return e ? parseFloat(getComputedStyle(e).fontSize).toFixed(1) : 'NA'; };
    L.push('字号 时间=' + sz('#time') + ' 天数=' + sz('#days') + ' 温度=' + sz('#temp')
         + ' 引文=' + sz('#text') + ' 小字=' + sz('.sub'));
    L.push('文本: ' + ['time','sec','date','lunar','desc','temp','hi','lo','feel','hum','label','target','days','detail','text','by','qdate']
      .map(function(id){var e=d.querySelector('#'+id);return id+'='+(e?e.textContent:'缺!');}).join(' | '));
    document.getElementById('out').textContent = L.join('\n');
  }, 3200);
});
</script></body></html>
