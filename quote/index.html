<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日一句</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    if (q.get('solid') === '1') document.documentElement.setAttribute('data-solid', '');
  })();
</script>
<style>
  .quote-block {
    width: 100%;
    padding: clamp(12px, 3vh, 26px) clamp(14px, 3vw, 26px);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  #text {
    margin: 0;
    text-align: center;
    font-size: clamp(14px, min(4.6vh, 3vw), 34px);
    line-height: 1.55;
    font-weight: var(--w-strong);
    letter-spacing: .01em;
    color: var(--ink);
    text-wrap: balance;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="main">
      <div class="block quote-block">
        <p id="text">—</p>
      </div>
      <div class="row">
        <span class="chip" id="by">—</span>
      </div>
    </div>
  </div>

<script>
(function () {
  // 本地句子池，零外部请求。名言标注作者，自写的标 —
  var POOL = [
    ['在隆冬，我终于知道，我身上有一个不可战胜的夏天。', '加缪'],
    ['重要的不是治愈，而是带着病痛活下去。', '加缪'],
    ['我反抗，故我们存在。', '加缪'],
    ['人是被判定为自由的。', '萨特'],
    ['要爱具体的人，不要爱抽象的人。', '陀思妥耶夫斯基'],
    ['最要紧的是：首先善良，其次诚实，再其次永远不要相互遗忘。', '陀思妥耶夫斯基'],
    ['我不是在黑暗中，我是黑暗本身的一部分。', '—'],
    ['哪有什么胜利可言，挺住意味着一切。', '里尔克'],
    ['你必须改变你的生活。', '里尔克'],
    ['你不需要离开房间。只需坐在桌前倾听。', '卡夫卡'],
    ['我不匆忙，太阳和月亮也不匆忙。', '佩索阿'],
    ['凡不可说的，应当沉默。', '维特根斯坦'],
    ['慢的乐趣怎么失传了呢？', '昆德拉'],
    ['一个人知道自己为什么而活，就可以忍受任何一种生活。', '尼采'],
    ['我偏爱写诗的荒谬，胜过不写诗的荒谬。', '辛波斯卡'],
    ['岁月不饶人，我亦未曾饶过岁月。', '木心'],
    ['我是一个在黑暗中大雪纷飞的人哪。', '木心'],
    ['所谓无底深渊，下去，也是前程万里。', '木心'],
    ['生活最好的状态是冷冷清清的风风火火。', '木心'],

    ['把今天过完，就是答案的一部分。', '—'],
    ['不必一次想清楚一生，先想清楚这一页。', '—'],
    ['焦虑多半是因为想得太远，而手边的事没做。', '—'],
    ['你只需要把灯打开，黑暗就不能再占满房间。', '—'],
    ['沉默不是没话说，是话太重。', '—'],
    ['慢一点没关系，方向对就行。', '—'],
    ['真正的自律，是不必跟自己讨价还价。', '—'],
    ['孤独不是身边没人，是没有一个人听得懂你在说什么。', '—'],
    ['休息不是浪费，是让齿轮咬得回去。', '—'],
    ['身体比脑子诚实，累了它先说。', '—'],
    ['有些日子用来前进，有些日子只用来站住。', '—'],
    ['难过的时候不要做决定。', '—'],
    ['把标准立在自己身上，别人的评价就只是参考。', '—'],
    ['你已经比你以为的走得更远了。', '—'],
    ['想不通的事先放下，答案常在走路时冒出来。', '—'],
    ['一天里做成一件事就够了。', '—'],
    ['不要在深夜评价自己。', '—'],
    ['不用向任何人证明你在努力。', '—'],
    ['把小事做对，秩序就回来了。', '—'],
    ['能安静待一会儿的人，心里有地方。', '—'],
    ['怕，是因为在乎；怕完了还是要去。', '—'],
    ['所有的笨拙，都是还没熟的手。', '—'],
    ['把话说清楚，比把话说漂亮重要。', '—'],
    ['情绪来了先别动手，它待不了太久。', '—'],
    ['对一个人最深的照顾，是记得他说过的事。', '—'],
    ['你不需要被所有人喜欢，只需要被几个人认真对待。', '—'],
    ['慢慢来，也是一种到。', '—'],
    ['今天不必赢，今天别断。', '—'],
    ['手边有热的东西，就不算太冷。', '—'],
    ['读书是替自己找一些能一起说话的人。', '—']
  ];

  /* 每半小时换一句。诗句来自「今日诗词」开放接口：
       GET https://v1.jinrishici.com/all.json
       返回 { content, author, origin, category }，免费、无需 key、
       响应头 access-control-allow-origin: * —— 浏览器能直连。
     接口万一挂了就落回下面这个本地句池，界面永远不会空。

     刷新节奏：时间切成 30 分钟一格，跨格才重新取；
     每 15 秒对一次表，到点立刻换，不靠 setInterval(30min) 慢慢漂。 */
  var SLOT_MS = 30 * 60 * 1000;
  var POEM_API = 'https://v1.jinrishici.com/all.json';

  /* ── 节日当天改用本地诗句（这个组件没有时钟，节日自己算）──
     今日诗词 all.json 实测 20 次里只有 2 次节日类（10%），
     节日当天靠它随机八成给不到该节日的诗，所以特殊日子走本地表。 */
  var FEST = [
    { type: 'solar', m: 10, d: 1,  name: '国庆'   },
    { type: 'solar', m: 10, d: 31, name: '万圣节' },
    { type: 'solar', m: 12, d: 25, name: '圣诞'   },
    { type: 'lunar', m: 8,  d: 15, name: '中秋'   },
    { type: 'lunar', m: 1,  d: 1,  name: '春节'   }
  ];

  function todayFestival() {
    var now = new Date();
    for (var k = 0; k < FEST.length; k++) {
      var f = FEST[k];
      if (f.type === 'solar') {
        if (now.getMonth() + 1 === f.m && now.getDate() === f.d) return f.name;
      } else if (typeof toLunar === 'function') {
        var l = toLunar(now);
        if (!l.leap && l.m === f.m && l.d === f.d) return f.name;
      }
    }
    return '';
  }

  var FESTIVAL_POEMS = {
    '春节': [
      ['爆竹声中一岁除，春风送暖入屠苏。', '王安石 · 元日'],
      ['千门万户曈曈日，总把新桃换旧符。', '王安石 · 元日'],
      ['半盏屠苏犹未举，灯前小草写桃符。', '陆游 · 除夜雪']
    ],
    '中秋': [
      ['但愿人长久，千里共婵娟。', '苏轼 · 水调歌头'],
      ['海上生明月，天涯共此时。', '张九龄 · 望月怀远'],
      ['今夜月明人尽望，不知秋思落谁家。', '王建 · 十五夜望月'],
      ['露从今夜白，月是故乡明。', '杜甫 · 月夜忆舍弟']
    ],
    '国庆': [
      ['会当凌绝顶，一览众山小。', '杜甫 · 望岳'],
      ['黄河远上白云间，一片孤城万仞山。', '王之涣 · 凉州词'],
      ['大漠孤烟直，长河落日圆。', '王维 · 使至塞上']
    ],
    '万圣节': [
      ['银烛秋光冷画屏，轻罗小扇扑流萤。', '杜牧 · 秋夕'],
      ['秋风清，秋月明，落叶聚还散。', '李白 · 秋风词'],
      ['露湿秋香满池岸，由来不羡瓦松高。', '郑谷 · 菊']
    ],
    '圣诞': [
      ['忽如一夜春风来，千树万树梨花开。', '岑参 · 白雪歌送武判官归京'],
      ['晚来天欲雪，能饮一杯无。', '白居易 · 问刘十九'],
      ['孤舟蓑笠翁，独钓寒江雪。', '柳宗元 · 江雪']
    ]
  };

  function slotHash(slot) {
    var h = slot;
    h = (h ^ 61) ^ (h >>> 16);
    h = h + (h << 3);
    h = h ^ (h >>> 4);
    h = h * 0x27d4eb2d;
    h = h ^ (h >>> 15);
    return Math.abs(h) % POOL.length;
  }

  var elText = document.getElementById('text');
  var elBy   = document.getElementById('by');
  var curSlot = -1;

  function renderLocal(slot) {
    var item = POOL[slotHash(slot)];
    elText.textContent = item[0];
    elBy.textContent = item[1];
  }

  function render() {
    var slot = Math.floor(Date.now() / SLOT_MS);
    if (slot === curSlot) return;
    curSlot = slot;

    // ① 节日当天：本地节日诗，不出网，确定命中
    var fp = FESTIVAL_POEMS[todayFestival()];
    if (fp && fp.length) {
      var p = fp[slot % fp.length];
      elText.textContent = p[0];
      elBy.textContent = p[1];
      return;
    }

    // ② 平时：取今日诗词
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);

    fetch(POEM_API, ctrl ? { signal: ctrl.signal, cache: 'no-store' } : { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || !d.content) throw new Error('empty');
        elText.textContent = d.content;
        var meta = [];
        if (d.author) meta.push(d.author);
        if (d.origin) meta.push(d.origin);
        elBy.textContent = meta.length ? meta.join(' · ') : '—';
      })
      .catch(function () {
        clearTimeout(timer);
        renderLocal(slot);      // 接口挂了用本地句池兜底
      });
  }

  render();
  setInterval(render, 15000);
})();
</script>
</body>
</html>
