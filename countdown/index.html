<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倒计时</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  #days { font-size: clamp(34px, min(26vh, 13vw), 132px); }
  .unit { font-size: clamp(11px, 2.6vh, 20px); letter-spacing: .1em; }
</style>
</head>
<body>
  <div class="card">
    <div class="main">
      <div class="block">
        <p class="display" id="days">—</p>
        <span class="unit">天</span>
      </div>
      <span class="chip chip--ink" id="label">—</span>
      <div class="row">
        <span class="chip" id="target">—</span>
        <span class="chip" id="pct">—</span>
      </div>
      <span class="chip" id="detail">—</span>
    </div>
  </div>

<script>
(function () {
  // 参数：?date=2027-06-07&label=高考
  var q = new URLSearchParams(location.search);
  var raw   = q.get('date')  || '2027-06-07';
  var label = q.get('label') || '高考';

  // 只取日期部分，避免时区把时刻算歪
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw.trim());
  var target = m
    ? new Date(+m[1], +m[2] - 1, +m[3], 0, 0, 0, 0)
    : new Date(2027, 5, 7, 0, 0, 0, 0);

  document.getElementById('label').textContent = label;
  document.getElementById('target').textContent =
    target.getFullYear() + '.' +
    ('0' + (target.getMonth() + 1)).slice(-2) + '.' +
    ('0' + target.getDate()).slice(-2);

  var elDays   = document.getElementById('days');
  var elDetail = document.getElementById('detail');
  var elPct    = document.getElementById('pct');

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var now = new Date();
    var diff = target - now;          // 毫秒
    var past = diff < 0;
    var abs  = Math.abs(diff);

    var d  = Math.floor(abs / 864e5);
    var h  = Math.floor(abs % 864e5 / 36e5);
    var mi = Math.floor(abs % 36e5 / 6e4);
    var s  = Math.floor(abs % 6e4 / 1e3);

    elDays.textContent = past ? '−' + d : d;
    elDetail.textContent = (past ? '已过去 ' : '还剩 ') + h + ' 时 ' + pad(mi) + ' 分 ' + pad(s) + ' 秒';

    // 进度：从今年 1 月 1 日走到目标日走了多少
    var start = new Date(now.getFullYear(), 0, 1);
    var span = target - start;
    var pct = span > 0 ? Math.min(100, Math.max(0, (now - start) / span * 100)) : 100;
    elPct.textContent = '今年已过 ' + pct.toFixed(0) + '%';
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
