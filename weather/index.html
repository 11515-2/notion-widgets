<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  #temp { font-size: clamp(32px, min(24vh, 12vw), 124px); }
  .deg  { font-size: clamp(15px, min(10vh, 5vw), 44px); }
</style>
</head>
<body>
  <div class="card">
    <div class="main">
      <span class="chip chip--strong" id="desc">正在读取…</span>
      <div class="block">
        <p class="display" id="temp">—</p>
        <span class="unit deg">°C</span>
      </div>
      <span class="chip" id="range">—</span>
      <span class="chip" id="extra">—</span>
    </div>
  </div>

<script>
(function () {
  // ── 只用 Open-Meteo，免费、无需 key ──────────────────────
  // 换城市：在嵌入地址后面加 ?city=sz（默认大同），不占组件界面
  var CITIES = {
    dt: { name: '大同', lat: 40.0933, lon: 113.2998 },
    sz: { name: '苏州', lat: 31.2989, lon: 120.5853 }
  };

  var WMO = {
    0:'晴', 1:'大部晴', 2:'多云', 3:'阴',
    45:'雾', 48:'雾凇',
    51:'毛毛雨', 53:'小雨', 55:'细密雨',
    56:'冻雨', 57:'冻雨',
    61:'小雨', 63:'中雨', 65:'大雨',
    66:'冻雨', 67:'强冻雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'雪粒',
    80:'阵雨', 81:'阵雨', 82:'强阵雨',
    85:'阵雪', 86:'强阵雪',
    95:'雷阵雨', 96:'雷暴冰雹', 99:'强雷暴冰雹'
  };

  var elTemp  = document.getElementById('temp');
  var elDesc  = document.getElementById('desc');
  var elRange = document.getElementById('range');
  var elExtra = document.getElementById('extra');

  var q = new URLSearchParams(location.search);
  var wanted = q.get('city');
  var current = (wanted && CITIES[wanted]) ? wanted : 'dt';

  var cache = {};         // 内存缓存，10 分钟
  var TTL = 10 * 60 * 1000;

  function fail(msg) {
    elTemp.textContent = '—';
    elDesc.textContent = msg || '暂时读不到天气';
    elRange.textContent = '—';
    elExtra.textContent = '—';
  }

  function render(d, city) {
    var cur = d.current || {};
    var day = (d.daily || {});
    elTemp.textContent = Math.round(cur.temperature_2m);
    elDesc.textContent = (WMO[cur.weather_code] || '—') + ' · ' + city.name;
    var hi = Math.round((day.temperature_2m_max || [])[0]);
    var lo = Math.round((day.temperature_2m_min || [])[0]);
    elRange.textContent = (isFinite(hi) && isFinite(lo))
      ? '最高 ' + hi + '°　最低 ' + lo + '°'
      : '—';
    elExtra.textContent = '体感 ' + Math.round(cur.apparent_temperature) + '°　湿度 '
                        + Math.round(cur.relative_humidity_2m) + '%';
  }

  function fetchWeather(key) {
    var city = CITIES[key];
    var hit = cache[key];
    if (hit && Date.now() - hit.at < TTL) { render(hit.data, city); return; }

    elDesc.textContent = '正在读取…';

    var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=' + city.lat + '&longitude=' + city.lon
            + '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m'
            + '&daily=temperature_2m_max,temperature_2m_min'
            + '&timezone=Asia%2FShanghai&forecast_days=1';

    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        cache[key] = { at: Date.now(), data: data };
        render(data, city);
      })
      .catch(function () {
        clearTimeout(timer);
        fail('暂时读不到天气');
      });
  }

  fetchWeather(current);
  setInterval(function () { fetchWeather(current); }, TTL);
})();
</script>
</body>
</html>
