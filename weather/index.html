<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气</title>
<link rel="stylesheet" href="../assets/base.css">
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* 主字号存变量，单位跟着比例走，不用 em（em 相对 body 的 16px） */
  .card { --big: clamp(30px, min(21vh, 10.5vw), 112px); }
  #temp { font-size: var(--big); }
  .deg  { font-size: calc(var(--big) * .34); }

  /* 温度块做成横向舒展的长条，别是个方块；底色比顶部状态块亮一档，突出主次 */
  .block.temp-block {
    padding-left: clamp(22px, 5.5vw, 48px);
    padding-right: clamp(22px, 5.5vw, 48px);
    background: var(--surface-2);
  }

  /* 底部四项数据：2×2 网格
     列宽用 auto（=该列最宽那格的宽度），所以对齐还在，但标签和数字不会被拉开；
     整体 justify-content:center 居中，不再靠固定宽度撑开 */
  .grid {
    display: grid;
    grid-template-columns: auto auto;
    gap: clamp(4px, 1vh, 8px) clamp(16px, 3vw, 28px);
    justify-content: center;
    margin-top: clamp(2px, .6vh, 6px);
  }
  .grid span {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: clamp(7px, 1.5vw, 13px);   /* 标签与数字之间的最小间隙 */
    font-size: clamp(10px, 2vh, 13px);
    color: var(--ink-2);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .grid b {
    color: var(--ink);
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="main">
      <span class="chip chip--strong" id="desc">正在读取…</span>

      <div class="block temp-block">
        <p class="display" id="temp">—</p>
        <span class="unit deg">°C</span>
      </div>

      <div class="grid">
        <span>最高<b id="hi">—</b></span>
        <span>最低<b id="lo">—</b></span>
        <span>体感<b id="feel">—</b></span>
        <span>湿度<b id="hum">—</b></span>
      </div>
    </div>
  </div>

<script>
(function () {
  // ── 只用 Open-Meteo，免费、无需 key ──────────────────────
  // 换城市：嵌地址后加 ?city=sz（默认大同），不占组件界面
  var CITIES = {
    dt: { name: '大同', lat: 40.0933, lon: 113.2998 },
    sz: { name: '苏州', lat: 31.2989, lon: 120.5853 }
  };

  var WMO = {
    0:'晴', 1:'大部晴', 2:'多云', 3:'阴',
    45:'雾', 48:'雾凇',
    51:'毛毛雨', 53:'小雨', 55:'细密雨',
    56:'冻雨', 57:'冻雨',
    61:'小雨', 63:'中雨', 65:'大雨',
    66:'冻雨', 67:'强冻雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'雪粒',
    80:'阵雨', 81:'阵雨', 82:'强阵雨',
    85:'阵雪', 86:'强阵雪',
    95:'雷阵雨', 96:'雷暴冰雹', 99:'强雷暴冰雹'
  };

  var elTemp = document.getElementById('temp');
  var elDesc = document.getElementById('desc');
  var elHi   = document.getElementById('hi');
  var elLo   = document.getElementById('lo');
  var elFeel = document.getElementById('feel');
  var elHum  = document.getElementById('hum');

  var q = new URLSearchParams(location.search);
  var wanted = q.get('city');
  var current = (wanted && CITIES[wanted]) ? wanted : 'dt';

  var cache = {};
  var TTL = 10 * 60 * 1000;

  function dash(el, txt) { el.textContent = txt; }

  function fail(msg) {
    elTemp.textContent = '—';
    elDesc.textContent = msg || '暂时读不到天气';
    dash(elHi, '—'); dash(elLo, '—'); dash(elFeel, '—'); dash(elHum, '—');
  }

  function render(d, city) {
    var cur = d.current || {};
    var day = (d.daily || {});

    elTemp.textContent = Math.round(cur.temperature_2m);
    elDesc.textContent = (WMO[cur.weather_code] || '—') + ' · ' + city.name;

    var hi = Math.round((day.temperature_2m_max || [])[0]);
    var lo = Math.round((day.temperature_2m_min || [])[0]);

    dash(elHi,   isFinite(hi) ? hi + '°' : '—');
    dash(elLo,   isFinite(lo) ? lo + '°' : '—');
    dash(elFeel, Math.round(cur.apparent_temperature) + '°');
    dash(elHum,  Math.round(cur.relative_humidity_2m) + '%');
  }

  function fetchWeather(key) {
    var city = CITIES[key];
    var hit = cache[key];
    if (hit && Date.now() - hit.at < TTL) { render(hit.data, city); return; }

    elDesc.textContent = '正在读取…';

    var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=' + city.lat + '&longitude=' + city.lon
            + '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m'
            + '&daily=temperature_2m_max,temperature_2m_min'
            + '&timezone=Asia%2FShanghai&forecast_days=1';

    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        cache[key] = { at: Date.now(), data: data };
        render(data, city);
      })
      .catch(function () {
        clearTimeout(timer);
        fail('暂时读不到天气');
      });
  }

  fetchWeather(current);
  setInterval(function () { fetchWeather(current); }, TTL);
})();
</script>
</body>
</html>
