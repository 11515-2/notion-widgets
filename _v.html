<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="./all/?theme=dark" style="width:660px;height:460px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var d = document.getElementById('f').contentDocument;
    var L = [];
    var bands = d.querySelectorAll('.band');
    L.push('带数=' + bands.length);
    for (var i = 0; i < bands.length; i++) {
      var b = bands[i];
      var ov = b.scrollWidth > b.clientWidth + 1;
      L.push('带' + (i+1) + (ov ? ' 横向溢出! ' + b.scrollWidth + '>' + b.clientWidth : ' ok ' + b.clientWidth + 'x' + b.clientHeight));
    }
    var card = d.querySelector('.card');
    L.push('card ' + (card.scrollHeight > card.clientHeight + 1 ? '竖向溢出 ' + card.scrollHeight + '>' + card.clientHeight : 'ok ' + card.clientHeight));
    var sz = function (s) { var e = d.querySelector(s); return e ? getComputedStyle(e).fontSize : 'NA'; };
    L.push('字号 时间=' + sz('#time') + ' 秒=' + sz('#sec') + ' 温度=' + sz('#temp')
         + ' 天数=' + sz('#days') + ' 引文=' + sz('#text') + ' chip=' + sz('.chip') + ' mini=' + sz('.mini'));
    L.push('label颜色=' + (function(){var e=d.querySelector('#label');var s=getComputedStyle(e);return 'bg='+s.backgroundColor+' fg='+s.color;})());
    L.push('文本: ' + ['time','sec','date','desc','temp','hi','lo','feel','hum','label','target','days','detail','by','qdate'].map(function(id){var e=d.querySelector('#'+id);return id+'='+(e?e.textContent:'X');}).join(' | '));
    document.getElementById('out').textContent = L.join('\n');
  }, 2800);
});
</script></body></html>
